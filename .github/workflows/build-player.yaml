name: 构建 AMLL Player iOS 版本
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "packages/docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-pre-release:
    name: 删除预发布版本的构建产物
    runs-on: ubuntu-latest
    steps:
      - name: 删除预发布版本的构建产物
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          assets: |
            *.*
          tag: ${{ github.ref_name }}-player-dev
          fail-if-no-assets: false
          fail-if-no-release: false

  build-tauri-ios:
    name: 自动构建 iOS 移动版 (无签名 IPA)
    needs: clean-pre-release
    runs-on: macos-14 # 使用 GitHub 托管的 Apple Silicon (M1/M2) 运行器以获取极速构建性能

    steps:
      - uses: actions/checkout@v4
        name: 克隆仓库
        with:
          fetch-depth: 0

      - name: 选择 Xcode 16 版本
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: 安装 PNPM
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链与 iOS 构建目标
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: "aarch64-apple-ios" # 仅安装物理 iOS 真机目标

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: ios-aarch64-only

      - name: 自动拉取并链接 iOS 预编译 FFmpeg 静态库
        shell: bash
        env:
          BUILDER_REPO: ITManCHINA/ffmpeg-builder
          FFMPEG_VERSION_TAG: "ffmpeg-8.0.1-ec1a92ac790933c2634397e05cf64bffd10762c2"
        run: |
          PACKAGE_NAME="ffmpeg-8.0.1-ios-arm64.tar.gz"
          DOWNLOAD_URL="https://github.com/${BUILDER_REPO}/releases/download/${FFMPEG_VERSION_TAG}/${PACKAGE_NAME}"
          EXTRACT_DIR="${{ github.workspace }}/vendor/ffmpeg_ios"

          echo "Downloading iOS FFmpeg static libraries from $DOWNLOAD_URL..."
          curl -f -sL $DOWNLOAD_URL -o $PACKAGE_NAME

          mkdir -p $EXTRACT_DIR
          echo "Extracting FFmpeg to $EXTRACT_DIR..."
          tar -xzf $PACKAGE_NAME -C $EXTRACT_DIR
          rm $PACKAGE_NAME

          # 设置链接编译所需的 FFMPEG_DIR 环境变量，映射真机目标
          echo "FFMPEG_DIR_AARCH64_APPLE_IOS=$EXTRACT_DIR" >> $GITHUB_ENV
          echo "FFmpeg iOS environment set up successfully."

      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs
        env:
          AMLL_IOS_BUILD: "true"

      - name: 自动初始化 iOS 工程
        run: |
          pnpm -F player tauri ios init
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 禁用 Xcode 工程自动签名 (免证书构建)
        shell: bash
        run: |
          # -----------------------------------------------------------------------
          # tauri ios init 生成的工程默认为 Automatic 签名，必须在构建前将其改为
          # Manual 并禁用签名，否则 xcodebuild 会要求选择 Development Team。
          # tauri ios build 内部通过 WebSocket 驱动 xcode-script，无法通过命令行
          # 参数覆盖签名设置，只能在项目文件层面修改。
          # -----------------------------------------------------------------------
          PBXPROJ="packages/player/src-tauri/gen/apple/amll-player.xcodeproj/project.pbxproj"

          # 切换为 Manual 签名模式，清空 Development Team
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"

          # 注入 CODE_SIGNING_REQUIRED=NO 和 CODE_SIGNING_ALLOWED=NO
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            let content = fs.readFileSync(path, "utf8");
            if (!content.includes("CODE_SIGNING_ALLOWED = NO")) {
              content = content.replaceAll(
                "CODE_SIGN_STYLE = Manual;",
                "CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;"
              );
              fs.writeFileSync(path, content, "utf8");
            }
            console.log("Code signing disabled in project.pbxproj");
          ' "$PBXPROJ"


      - name: 构建前端资源
        run: pnpm -F player build
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 注入 iOS 后台音频播放权限 (Info.plist)
        shell: bash
        run: |
          # 在 Xcode 工程生成后，通过 PlistBuddy 写入 UIBackgroundModes=audio 权限，支持后台切歌与播放
          PLIST_PATH="packages/player/src-tauri/gen/apple/amll-player_iOS/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST_PATH" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST_PATH" || true
          echo "Info.plist background audio modes injected."

      - name: 使用 Tauri CLI 构建无签名 iOS 应用
        run: |
          # xcode-script 通过 WebSocket 与 Tauri CLI 通信获取构建指令，
          # 必须通过 tauri ios build 启动，无法用裸 xcodebuild 替代。
          # 签名已在上一步于 .pbxproj 层面禁用，无需额外参数。
          pnpm -F player tauri ios build
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 压包并生成无签名版 .ipa
        run: |
          # tauri ios build 的输出位置因版本而异，动态查找 .app
          APP_PATH=$(find packages/player/src-tauri/gen/apple -name "AMLL Player.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AMLL Player.app" -path "*/release-iphoneos/*" 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: AMLL Player.app not found. Listing possible locations:"
            find . -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found: $APP_PATH"

          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r amll-player-unsigned.ipa Payload
          echo "IPA created:"
          ls -la amll-player-unsigned.ipa

      - name: 上传无签名 ipa 包至 GitHub Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMLL Player iOS Unsigned IPA
          path: build/amll-player-unsigned.ipa
