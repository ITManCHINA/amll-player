name: 构建 AMLL Player iOS 版本
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "packages/docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-pre-release:
    name: 删除预发布版本的构建产物
    runs-on: ubuntu-latest
    steps:
      - name: 删除预发布版本的构建产物
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          assets: |
            *.*
          tag: ${{ github.ref_name }}-player-dev
          fail-if-no-assets: false
          fail-if-no-release: false

  build-tauri-ios:
    name: 自动构建 iOS 移动版 (无签名 IPA)
    needs: clean-pre-release
    runs-on: macos-14 # 使用 GitHub 托管的 Apple Silicon (M1/M2) 运行器以获取极速构建性能

    steps:
      - uses: actions/checkout@v4
        name: 克隆仓库
        with:
          fetch-depth: 0

      - name: 安装 PNPM
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链与 iOS 构建目标
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: "aarch64-apple-ios" # 仅安装物理 iOS 真机目标

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: ios-aarch64-only

      - name: 自动拉取并链接 iOS 预编译 FFmpeg 静态库
        shell: bash
        env:
          BUILDER_REPO: ITManCHINA/ffmpeg-builder
          FFMPEG_VERSION_TAG: "ffmpeg-7.1-930b71d3f307191fb0eab7ad97ad66517b21b655"
        run: |
          PACKAGE_NAME="ffmpeg-7.1-ios-arm64.tar.gz"
          DOWNLOAD_URL="https://github.com/${BUILDER_REPO}/releases/download/${FFMPEG_VERSION_TAG}/${PACKAGE_NAME}"
          EXTRACT_DIR="${{ github.workspace }}/vendor/ffmpeg_ios"

          echo "Downloading iOS FFmpeg static libraries from $DOWNLOAD_URL..."
          curl -f -sL $DOWNLOAD_URL -o $PACKAGE_NAME

          mkdir -p $EXTRACT_DIR
          echo "Extracting FFmpeg to $EXTRACT_DIR..."
          tar -xzf $PACKAGE_NAME -C $EXTRACT_DIR
          rm $PACKAGE_NAME

          # 设置链接编译所需的 FFMPEG_DIR 环境变量，映射真机目标
          echo "FFMPEG_DIR_AARCH64_APPLE_IOS=$EXTRACT_DIR" >> $GITHUB_ENV
          echo "FFmpeg iOS environment set up successfully."

      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs

      - name: 自动初始化 iOS 工程及元数据
        run: |
          # 首次在 CI 环境中生成 iOS 相关的模板、CocoaPods 依赖及项目文件
          pnpm -F player tauri ios init --non-interactive
          
          # 执行前置打包，构建前端静态文件与 Tauri Rust 静态库，使 Xcode 空间内容充实
          pnpm -F player tauri ios build --no-bundle
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 注入 iOS 后台音频播放权限 (Info.plist)
        shell: bash
        run: |
          # 在 Xcode 工程生成后，通过 PlistBuddy 写入 UIBackgroundModes=audio 权限，支持后台切歌与播放
          PLIST_PATH="packages/player/src-tauri/gen/apple/amll-player_iOS/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST_PATH" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST_PATH" || true
          echo "Info.plist background audio modes injected."

      - name: 使用 xcodebuild 强行编译无签名 iOS 归档包 (免证书)
        run: |
          xcodebuild archive \
            -workspace packages/player/src-tauri/gen/apple/amll-player.xcworkspace \
            -scheme "amll-player_iOS" \
            -configuration Release \
            -archivePath build/amll-player.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 压包并生成无签名版 .ipa
        run: |
          # 建立规范的 Payload 目录结构并复制 .app 文件
          mkdir -p build/Payload
          cp -r build/amll-player.xcarchive/Products/Applications/amll-player.app build/Payload/
          
          # 压缩为无签名 ipa 包
          cd build
          zip -r amll-player-unsigned.ipa Payload
          echo "Verification: amll-player-unsigned.ipa size and file generated."
          ls -la amll-player-unsigned.ipa

      - name: 上传无签名 ipa 包至 GitHub Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMLL Player iOS Unsigned IPA
          path: build/amll-player-unsigned.ipa
