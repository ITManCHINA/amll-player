name: 构建 AMLL Player Tauri 多端版本
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "packages/docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-pre-release:
    name: 删除预发布版本的构建产物
    runs-on: ubuntu-latest
    steps:
      - name: 删除预发布版本的构建产物
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          assets: |
            *.*
          tag: ${{ github.ref_name }}-player-dev
          fail-if-no-assets: false
          fail-if-no-release: false

  build-tauri-android:
    name: 构建 Tauri 安卓移动版本 (${{ matrix.target }})
    needs: clean-pre-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            ffmpeg_arch: arm64-v8a
          - target: armv7
            rust_target: armv7-linux-androideabi
            ffmpeg_arch: armeabi-v7a
          - target: i686
            rust_target: i686-linux-android
            ffmpeg_arch: x86
          - target: x86_64
            rust_target: x86_64-linux-android
            ffmpeg_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        name: 克隆仓库
        with:
          fetch-depth: 0 # 为了正确生成开发版本号码

      - name: 安装 PNPM
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: "x86_64-unknown-linux-gnu,${{ matrix.rust_target }}"

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: 安装 wasm32 目标
        run: rustup target add wasm32-unknown-unknown

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: android-${{ matrix.target }}

      - name: 安装 FFmpeg 所需系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential yasm nasm

      - name: 设置 Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK
        run: sdkmanager --install "ndk;27.2.12479018"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: 下载并设置预编译的 FFmpeg 库 (Android)
        shell: bash
        env:
          BUILDER_REPO: apoint123/ffmpeg-builder
          FFMPEG_VERSION_TAG: "8.0.1"
        run: |
          PACKAGE_NAME="ffmpeg-${FFMPEG_VERSION_TAG}-android-${{ matrix.ffmpeg_arch }}.tar.gz"
          DOWNLOAD_URL="https://github.com/${BUILDER_REPO}/releases/latest/download/${PACKAGE_NAME}"
          EXTRACT_DIR="${{ github.workspace }}/vendor/ffmpeg_${{ matrix.rust_target }}"

          echo "Downloading $PACKAGE_NAME..."
          curl -f -sL $DOWNLOAD_URL -o $PACKAGE_NAME

          mkdir -p $EXTRACT_DIR
          echo "Extracting $PACKAGE_NAME to $EXTRACT_DIR..."
          tar -xzf $PACKAGE_NAME -C $EXTRACT_DIR
          rm $PACKAGE_NAME

          TARGET_ENV_VAR="FFMPEG_DIR_$(echo ${{ matrix.rust_target }} | tr '[:lower:]' '[:upper:]' | tr '-' '_')"
          echo "Setting $TARGET_ENV_VAR=$EXTRACT_DIR"
          echo "$TARGET_ENV_VAR=$EXTRACT_DIR" >> $GITHUB_ENV

      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs

      - name: 构建 AMLL Player 安卓移动版程序
        env:
          CARGO_NDK_ANDROID_PLATFORM: 26
        run: |
          export NDK_HOME=$ANDROID_NDK_HOME
          export JAVA_HOME=$JAVA_HOME_17_X64
          pnpm -F player tauri android build --target ${{ matrix.target }}

      - name: 上传产物到 Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMLL Player Android ${{ matrix.target }}
          path: |
            packages/player/src-tauri/gen/android/app/build/outputs/**/*.apk
            packages/player/src-tauri/gen/android/app/build/outputs/**/*.aab
